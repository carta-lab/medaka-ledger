name: TestFlight

# 手動実行でビルドしてTestFlightへ配信する（DECISIONS.md A、docs/TESTFLIGHT.md）。
# 必要なSecretsは docs/TESTFLIGHT.md を参照。

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set (docs/TESTFLIGHT.md)"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "Xcode 26 not found"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project MedakaLedger.xcodeproj \
            -scheme MedakaLedger \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MedakaLedger.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee build/archive.log | scripts/ci/filter-log.sh

      - name: Export and upload
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" scripts/testflight/ExportOptions.plist > build/ExportOptions.plist
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/MedakaLedger.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: build/*.log
          retention-days: 7

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
